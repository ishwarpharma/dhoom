<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="80" fill="#0A0A0A"/>
  
  <!-- Speed lines -->
  <line x1="40" y1="220" x2="160" y2="220" stroke="#FF4500" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <line x1="20" y1="250" x2="130" y2="250" stroke="#FF4500" stroke-width="5" stroke-linecap="round" opacity="0.4"/>
  <line x1="50" y1="280" x2="150" y2="280" stroke="#FF4500" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
  
  <!-- Rear wheel -->
  <circle cx="170" cy="340" r="70" fill="none" stroke="#888" stroke-width="18"/>
  <circle cx="170" cy="340" r="30" fill="none" stroke="#666" stroke-width="10"/>
  <circle cx="170" cy="340" r="8" fill="#FF4500"/>
  
  <!-- Front wheel -->
  <circle cx="380" cy="340" r="65" fill="none" stroke="#888" stroke-width="18"/>
  <circle cx="380" cy="340" r="28" fill="none" stroke="#666" stroke-width="10"/>
  <circle cx="380" cy="340" r="8" fill="#FF4500"/>
  
  <!-- Frame / body -->
  <path d="M170 340 L220 220 L310 200 L380 270 L380 340" fill="none" stroke="#CCC" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>
  
  <!-- Engine block -->
  <rect x="215" y="250" width="80" height="60" rx="8" fill="#444"/>
  <rect x="225" y="260" width="60" height="40" rx="5" fill="#333"/>
  
  <!-- Fuel tank / seat -->
  <path d="M220 220 Q270 190 330 205 L310 200 L220 220Z" fill="#FF4500"/>
  
  <!-- Handlebar -->
  <line x1="350" y1="200" x2="420" y2="185" stroke="#AAA" stroke-width="12" stroke-linecap="round"/>
  <line x1="420" y1="185" x2="425" y2="215" stroke="#AAA" stroke-width="10" stroke-linecap="round"/>
  
  <!-- Rider silhouette (minimal) -->
  <ellipse cx="285" cy="195" rx="22" ry="22" fill="#222"/>
  <path d="M263 215 Q255 260 270 270 L310 265 Q320 240 300 215Z" fill="#222"/>
  
  <!-- Dhoom D lettermark (subtle) -->
  <text x="430" y="130" font-family="Georgia,serif" font-size="72" font-weight="bold" fill="#FF4500" opacity="0.9">D</text>
  
  <!-- Exhaust -->
  <path d="M175 320 Q140 330 110 360" stroke="#666" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M175 335 Q135 345 100 375" stroke="#555" stroke-width="7" fill="none" stroke-linecap="round"/>
</svg>
