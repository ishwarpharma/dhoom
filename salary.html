<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dhoom — Salary Summary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --or:#FF6B00;--orl:#FFF3E8;
  --gr:#16A34A;--grl:#DCFCE7;
  --bl:#2563EB;--bll:#DBEAFE;
  --rd:#DC2626;--rdl:#FEE2E2;
  --am:#D97706;--aml:#FEF3C7;
  --bg:#F8F7F4;--card:#fff;
  --text:#111;--t2:#555;--t3:#999;--border:#E8E6E0;
  --fh:'Rajdhani',sans-serif;--fb:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);font-family:var(--fb);color:var(--text);min-height:100vh;}

.topbar{background:#111;padding:0 28px;display:flex;align-items:center;justify-content:space-between;height:58px;position:sticky;top:0;z-index:100;border-bottom:2px solid var(--or);}
.tb-brand{display:flex;align-items:center;gap:10px;}
.tb-logo{width:30px;height:30px;}
.tb-name{font-family:var(--fh);font-size:20px;font-weight:700;letter-spacing:4px;color:#fff;}
.tb-sub{font-size:11px;color:#666;letter-spacing:2px;text-transform:uppercase;margin-left:4px;}
.tb-right{display:flex;align-items:center;gap:10px;}
.tb-upd{font-size:12px;color:#666;}
.btn-rf{background:var(--or);border:none;color:#fff;padding:7px 16px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--fb);}
.btn-rf:disabled{opacity:0.4;}
.btn-back{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.25);color:#fff;padding:7px 14px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--fb);}

.page{max-width:1200px;margin:0 auto;padding:24px 20px;}

.errbanner{display:none;background:#FEE2E2;border:1px solid #fca5a5;color:var(--rd);padding:12px 18px;border-radius:10px;margin-bottom:16px;font-size:13px;font-weight:600;}
.errbanner.show{display:block;}

/* MONTH TABS */
.month-tabs-wrap{background:var(--card);border-radius:14px;padding:16px 18px;margin-bottom:20px;border:1px solid var(--border);box-shadow:0 1px 6px rgba(0,0,0,0.05);}
.month-tabs-title{font-family:var(--fh);font-size:15px;font-weight:700;margin-bottom:12px;letter-spacing:0.5px;}
.month-tabs{display:flex;flex-wrap:wrap;gap:8px;}
.mtab{padding:7px 16px;border-radius:20px;font-size:13px;font-weight:600;border:1.5px solid var(--border);background:var(--bg);cursor:pointer;color:var(--t2);transition:all 0.15s;font-family:var(--fb);}
.mtab:hover{border-color:var(--or);color:var(--or);}
.mtab.active{background:var(--or);border-color:var(--or);color:#fff;}
.period-label{font-size:12px;color:var(--t3);margin-top:10px;font-weight:500;}

/* REP GRID */
.rep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-bottom:24px;}
.rep-card{background:var(--card);border-radius:14px;border:1px solid var(--border);padding:18px;box-shadow:0 1px 5px rgba(0,0,0,0.05);cursor:pointer;transition:all 0.18s;position:relative;overflow:hidden;user-select:none;}
.rep-card:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,0.1);border-color:var(--or);}
.rep-card-stripe{position:absolute;top:0;left:0;right:0;height:3px;background:var(--or);}
.rep-name{font-family:var(--fh);font-size:19px;font-weight:700;letter-spacing:0.5px;margin-bottom:12px;}
.rep-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.rs{background:var(--bg);border-radius:8px;padding:8px 10px;}
.rs-num{font-size:20px;font-weight:700;color:var(--text);font-family:var(--fh);}
.rs-num.orange{color:var(--or);}
.rs-lbl{font-size:10px;color:var(--t3);font-weight:600;margin-top:2px;}
.att-row{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.wd-dots{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px;}
.wd-dot{width:9px;height:9px;border-radius:2px;}
.wd-present{background:var(--gr);}
.wd-absent{background:var(--border);}
.click-hint{font-size:10px;color:var(--t3);margin-top:8px;text-align:right;font-style:italic;}

/* BADGE */
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
.b-green{background:var(--grl);color:var(--gr);}
.b-red{background:var(--rdl);color:var(--rd);}
.b-amber{background:var(--aml);color:var(--am);}
.b-gray{background:var(--bg);color:var(--t3);border:1px solid var(--border);}

/* DETAIL VIEW */
#detailView{display:none;}
.detail-header{background:var(--card);border-radius:14px;padding:20px;margin-bottom:16px;border:1px solid var(--border);}
.detail-rep-name{font-family:var(--fh);font-size:26px;font-weight:700;letter-spacing:1px;}
.detail-period{font-size:13px;color:var(--t2);margin-top:2px;margin-bottom:14px;}
.detail-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;}
.dk{background:var(--bg);border-radius:10px;padding:12px 14px;text-align:center;}
.dk-num{font-family:var(--fh);font-size:24px;font-weight:700;color:var(--text);}
.dk-num.orange{color:var(--or);}
.dk-lbl{font-size:11px;color:var(--t3);font-weight:600;margin-top:3px;}

/* TABLE */
.tcard{background:var(--card);border-radius:14px;border:1px solid var(--border);overflow:hidden;margin-bottom:20px;}
.thead-bar{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.ttitle{font-family:var(--fh);font-size:16px;font-weight:700;letter-spacing:0.5px;}
.twrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
thead th{background:#FAFAF8;padding:11px 16px;text-align:left;font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:0.06em;border-bottom:1px solid var(--border);white-space:nowrap;}
tbody tr{border-bottom:1px solid var(--border);transition:background 0.12s;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:#FFFAF5;}
tbody td{padding:11px 16px;font-size:14px;vertical-align:middle;}
.row-absent td{background:#FAFAF8;color:var(--t3);}
.row-sunday td{background:#F5F5F2;color:var(--t3);opacity:0.7;}
.row-clickable{cursor:pointer;}

/* DAY MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(17,17,17,0.5);z-index:300;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.show{display:flex;}
.modal-box{background:#fff;border-radius:16px;max-width:480px;width:100%;max-height:82vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.25);}
.modal-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;position:sticky;top:0;background:#fff;border-radius:16px 16px 0 0;}
.modal-rep{font-family:var(--fh);font-size:19px;font-weight:700;letter-spacing:0.3px;}
.modal-date{font-size:13px;color:var(--t2);margin-top:3px;}
.modal-close{background:var(--bg);border:none;width:30px;height:30px;min-width:30px;border-radius:8px;font-size:15px;cursor:pointer;color:var(--t2);}
.modal-close:hover{background:var(--orl);color:var(--or);}
.modal-body{padding:16px 20px 20px;}
.modal-summary{display:flex;gap:10px;margin-bottom:14px;}
.ms{flex:1;background:var(--bg);border-radius:10px;padding:10px 12px;text-align:center;}
.ms-num{font-family:var(--fh);font-size:18px;font-weight:700;}
.ms-lbl{font-size:10px;color:var(--t3);font-weight:600;margin-top:2px;}
.visit-item{background:var(--bg);border-radius:10px;padding:12px 14px;margin-bottom:9px;border-left:3px solid var(--or);}
.visit-item:last-child{margin-bottom:0;}
.visit-top{display:flex;align-items:center;justify-content:space-between;}
.visit-time{font-family:var(--fh);font-size:16px;font-weight:700;color:var(--or);}
.visit-idx{font-size:11px;color:var(--t3);font-weight:600;}
.visit-party{font-size:14px;font-weight:600;margin-top:3px;color:var(--text);}
.visit-stats{display:flex;gap:16px;margin-top:8px;font-size:12px;color:var(--t2);}
.visit-stats b{color:var(--text);}
.no-visits{text-align:center;padding:34px 10px;color:var(--t3);font-size:14px;}

.erow{display:flex;gap:8px;margin-bottom:16px;}
.btn-exp{padding:8px 16px;border-radius:8px;border:1.5px solid var(--border);background:var(--card);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--fb);color:var(--t2);}
.btn-exp:hover{border-color:var(--or);color:var(--or);}

#loader{display:none;position:fixed;inset:0;background:rgba(248,247,244,0.9);z-index:200;align-items:center;justify-content:center;flex-direction:column;gap:14px;backdrop-filter:blur(3px);}
#loader.show{display:flex;}
.spin{width:42px;height:42px;border:3px solid var(--border);border-top-color:var(--or);border-radius:50%;animation:sp 0.7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
.ltxt{font-family:var(--fh);font-size:15px;font-weight:600;color:var(--t2);letter-spacing:2px;text-transform:uppercase;}

@media(max-width:600px){.topbar{padding:0 14px;}.page{padding:14px;}.tb-sub{display:none;}.rep-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>

<div id="loader"><div class="spin"></div><div class="ltxt" id="loaderTxt">Loading...</div></div>

<div class="topbar">
  <div class="tb-brand">
    <svg class="tb-logo" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <rect width="512" height="512" rx="80" fill="#FF6B00"/>
      <circle cx="160" cy="340" r="65" fill="none" stroke="#fff" stroke-width="18"/>
      <circle cx="160" cy="340" r="7" fill="#fff"/>
      <circle cx="368" cy="340" r="60" fill="none" stroke="#fff" stroke-width="18"/>
      <circle cx="368" cy="340" r="7" fill="#fff"/>
      <path d="M160 340 L210 225 L300 205 L368 275 L368 340" fill="none" stroke="#fff" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M210 225 Q258 195 318 210 L300 205 L210 225Z" fill="#FFD4B0"/>
    </svg>
    <div>
      <span class="tb-name">DHOOM</span>
      <span class="tb-sub">Salary Processing</span>
    </div>
  </div>
  <div class="tb-right">
    <span class="tb-upd" id="lastUpd">—</span>
    <button class="btn-back" id="backBtn" onclick="showList()" style="display:none">← All Reps</button>
    <button class="btn-rf" id="rfBtn" onclick="loadData()">↺ Refresh</button>
  </div>
</div>

<div class="page">
  <div class="errbanner" id="errBanner"></div>

  <!-- MONTH TABS -->
  <div class="month-tabs-wrap">
    <div class="month-tabs-title">Select Month</div>
    <div class="month-tabs" id="monthTabs"><span style="font-size:13px;color:var(--t3);">Loading months…</span></div>
    <div class="period-label" id="periodLabel">—</div>
  </div>

  <!-- LIST VIEW -->
  <div id="listView">
    <div class="rep-grid" id="repGrid">
      <div style="color:var(--t3);text-align:center;padding:40px;grid-column:1/-1;font-size:14px;">Loading data...</div>
    </div>
  </div>

  <!-- DETAIL VIEW -->
  <div id="detailView">
    <div class="detail-header">
      <div class="detail-rep-name" id="detailName">—</div>
      <div class="detail-period" id="detailPeriod">—</div>
      <div class="detail-kpis" id="detailKpis"></div>
    </div>
    <div class="erow">
      <button class="btn-exp" onclick="exportCSV()">⬇ Export CSV</button>
      <button class="btn-exp" onclick="window.print()">🖨 Print</button>
    </div>
    <div class="tcard">
      <div class="thead-bar">
        <div class="ttitle">Day-wise Summary</div>
        <div style="font-size:12px;color:var(--t3);" id="detailSub">—</div>
      </div>
      <div class="twrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Day</th>
              <th>Status</th>
              <th>First Call</th>
              <th>Last Call</th>
              <th>Total Visits</th>
            </tr>
          </thead>
          <tbody id="detailBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- DAY DETAIL MODAL -->
<div class="modal-overlay" id="dayModalOverlay">
  <div class="modal-box">
    <div class="modal-head">
      <div>
        <div class="modal-rep" id="dmRepName">—</div>
        <div class="modal-date" id="dmDate">—</div>
      </div>
      <button class="modal-close" id="dmCloseBtn">✕</button>
    </div>
    <div class="modal-body" id="dmBody"></div>
  </div>
</div>

<script>
var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbysz5L-MOu0T6IH-c9CmRzCRpE6DoUynVvBhhfSALPmv8_Za5XX1910kW8HD4TJz6bdUA/exec";

var allRows = [];
var selectedFrom = "";
var selectedTo = "";
var currentRep = "";
var currentRepRows = [];
var DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

// ── BOOT ──
window.onload = function(){
  loadData();
};

// ── BUILD MONTH TABS — ONLY FOR MONTHS THAT HAVE DATA ──
function buildMonthTabs(){
  var tabs = document.getElementById("monthTabs");
  tabs.innerHTML = "";

  // Collect distinct yyyy-mm keys present in the loaded rows
  var monthSet = {};
  allRows.forEach(function(r){
    if(r.date && r.date.length >= 7) monthSet[r.date.slice(0, 7)] = true;
  });
  var monthKeys = Object.keys(monthSet).sort(); // ascending: "2025-08", "2025-09", ...

  if(!monthKeys.length){
    tabs.innerHTML = '<span style="font-size:13px;color:var(--t3);">No data available yet.</span>';
    document.getElementById("periodLabel").textContent = "—";
    document.getElementById("repGrid").innerHTML =
      '<div style="color:var(--t3);text-align:center;padding:40px;grid-column:1/-1;font-size:14px;">No data found.</div>';
    return;
  }

  // Keep the currently selected month if it still has data, else default to the latest month
  var prevKey = selectedFrom ? selectedFrom.slice(0, 7) : "";
  var defaultKey = monthKeys.indexOf(prevKey) !== -1 ? prevKey : monthKeys[monthKeys.length - 1];

  monthKeys.forEach(function(key){
    var parts = key.split("-");
    var yr = parseInt(parts[0], 10);
    var mo = parseInt(parts[1], 10) - 1; // 0-based
    var label = MONTHS[mo].substring(0,3) + " " + yr;
    var btn = document.createElement("div");
    btn.className = "mtab" + (key === defaultKey ? " active" : "");
    btn.textContent = label;
    btn.setAttribute("data-yr", yr);
    btn.setAttribute("data-mo", mo);
    btn.onclick = function(){
      document.querySelectorAll(".mtab").forEach(function(t){t.classList.remove("active");});
      this.classList.add("active");
      selectMonth(parseInt(this.getAttribute("data-yr")), parseInt(this.getAttribute("data-mo")));
    };
    tabs.appendChild(btn);
  });

  var dp = defaultKey.split("-");
  selectMonth(parseInt(dp[0], 10), parseInt(dp[1], 10) - 1);
}

function selectMonth(yr, mo){
  var from  = new Date(yr, mo, 1);
  var to    = new Date(yr, mo + 1, 0); // last day of month
  var today = new Date();
  today.setHours(0, 0, 0, 0);

  // If this month runs into the future, stop at today — no point
  // showing/counting days that haven't happened yet.
  if(to > today) to = today;

  selectedFrom = fmt(from);
  selectedTo   = fmt(to);
  var dayCount = Math.round((to - from) / 86400000) + 1;
  document.getElementById("periodLabel").textContent =
    "Period: " + selectedFrom + "  to  " + selectedTo +
    "  (" + dayCount + " days)";
  if(allRows.length) applyAndRender();
}

function fmt(d){ return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function pad(n){ return n < 10 ? "0" + n : String(n); }

// ── LOAD DATA ──
function loadData(){
  showLoader("Loading data...");
  document.getElementById("rfBtn").disabled = true;
  document.getElementById("errBanner").classList.remove("show");

  fetch(SCRIPT_URL + "?action=all&cb=" + Date.now())
    .then(function(r){
      if(!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function(data){
      if(!data.success) throw new Error(data.error || "Script error");

      allRows = (data.rows || []).map(function(r){
        // Normalize date
        var rawDate = String(r.date || "").trim();
        if(rawDate.length > 10 && rawDate.indexOf("-") === -1){
          var d = new Date(rawDate);
          if(!isNaN(d.getTime())) rawDate = fmt(d);
        }
        // Normalize time to HH:MM
        var rawTime = String(r.time || "").trim();
        if(rawTime.length > 5){
          var td = new Date("2000-01-01T" + rawTime);
          if(isNaN(td.getTime())) {
            td = new Date(rawTime);
          }
          if(!isNaN(td.getTime())) rawTime = pad(td.getHours()) + ":" + pad(td.getMinutes());
        }
        return {
          date: rawDate,
          time: rawTime,
          repName: String(r.repName || "").trim(),
          party: String(r.party || "").trim(),
          order: Number(r.order) || 0,
          collection: Number(r.collection) || 0
        };
      }).filter(function(r){ return r.repName && r.date && r.date.length === 10; });

      hideLoader();
      document.getElementById("rfBtn").disabled = false;
      document.getElementById("lastUpd").textContent =
        "Updated " + new Date().toLocaleTimeString("en-IN", {hour:"2-digit", minute:"2-digit"});
      buildMonthTabs();
    })
    .catch(function(err){
      hideLoader();
      document.getElementById("rfBtn").disabled = false;
      document.getElementById("errBanner").textContent = "⚠️ " + err.message + " — Make sure Apps Script is deployed with Anyone access.";
      document.getElementById("errBanner").classList.add("show");
    });
}

// ── FILTER & RENDER ──
function applyAndRender(){
  var filtered = allRows.filter(function(r){
    return r.date >= selectedFrom && r.date <= selectedTo;
  });
  if(currentRep){
    renderDetail(currentRep, filtered.filter(function(r){ return r.repName === currentRep; }));
  } else {
    renderGrid(filtered);
  }
}

// ── REP GRID ──
function renderGrid(rows){
  // Group by rep
  var reps = {};
  rows.forEach(function(r){
    if(!reps[r.repName]) reps[r.repName] = { rows: [], days: {} };
    reps[r.repName].rows.push(r);
    reps[r.repName].days[r.date] = 1;
  });

  var allDates = getDatesInRange(selectedFrom, selectedTo);
  var sorted = Object.keys(reps).sort();

  if(!sorted.length){
    document.getElementById("repGrid").innerHTML =
      '<div style="color:var(--t3);text-align:center;padding:40px;grid-column:1/-1;font-size:14px;">No data for this period.</div>';
    return;
  }

  // Build each card as a DOM element to avoid onclick escaping issues
  var grid = document.getElementById("repGrid");
  grid.innerHTML = "";

  sorted.forEach(function(name){
    var d = reps[name];
    var workDays = Object.keys(d.days).length;
    var totalDays = allDates.length;
    var totalCalls = d.rows.length;
    var totalOrder = d.rows.reduce(function(s,r){return s+r.order;},0);
    var totalColl  = d.rows.reduce(function(s,r){return s+r.collection;},0);
    var attPct = totalDays > 0 ? Math.round(workDays / totalDays * 100) : 0;
    var attCls = attPct >= 80 ? "b-green" : attPct >= 60 ? "b-amber" : "b-red";

    // Working day dots
    var dotsHTML = allDates.slice(0,31).map(function(dt){
      return '<div class="wd-dot ' + (d.days[dt] ? "wd-present" : "wd-absent") + '" title="' + dt + '"></div>';
    }).join("");

    var card = document.createElement("div");
    card.className = "rep-card";
    card.innerHTML =
      '<div class="rep-card-stripe"></div>' +
      '<div class="rep-name">' + name + '</div>' +
      '<div class="rep-stats">' +
        '<div class="rs"><div class="rs-num orange">' + workDays + '</div><div class="rs-lbl">Working Days</div></div>' +
        '<div class="rs"><div class="rs-num">' + totalCalls + '</div><div class="rs-lbl">Total Visits</div></div>' +
        '<div class="rs"><div class="rs-num">₹' + fmtN(totalOrder) + '</div><div class="rs-lbl">Orders</div></div>' +
        '<div class="rs"><div class="rs-num">₹' + fmtN(totalColl) + '</div><div class="rs-lbl">Collection</div></div>' +
      '</div>' +
      '<div class="att-row">' +
        '<span class="badge ' + attCls + '">' + attPct + '% attendance</span>' +
        '<span style="font-size:12px;color:var(--t3);">' + workDays + ' / ' + totalDays + ' days</span>' +
      '</div>' +
      '<div class="wd-dots">' + dotsHTML + '</div>' +
      '<div class="click-hint">Tap for day-wise detail →</div>';

    // Use closure to capture name correctly
    (function(repName){
      card.addEventListener("click", function(){ openRep(repName); });
    })(name);

    grid.appendChild(card);
  });
}

function fmtN(n){
  if(n >= 100000) return (n/100000).toFixed(1) + "L";
  if(n >= 1000)   return (n/1000).toFixed(1) + "K";
  return n.toLocaleString("en-IN");
}

// ── OPEN REP ──
function openRep(name){
  currentRep = name;
  var repRows = allRows.filter(function(r){
    return r.repName === name && r.date >= selectedFrom && r.date <= selectedTo;
  });
  currentRepRows = repRows;
  renderDetail(name, repRows);
  document.getElementById("backBtn").style.display = "";
  document.getElementById("listView").style.display = "none";
  document.getElementById("detailView").style.display = "block";
  window.scrollTo(0, 0);
}

// ── RENDER DETAIL ──
function renderDetail(name, rows){
  var allDates = getDatesInRange(selectedFrom, selectedTo);

  // Group by date
  var byDate = {};
  rows.forEach(function(r){
    if(!byDate[r.date]) byDate[r.date] = { times: [], parties: [], order: 0, collection: 0 };
    if(r.time) byDate[r.date].times.push(r.time);
    if(r.party) byDate[r.date].parties.push(r.party);
    byDate[r.date].order      += r.order;
    byDate[r.date].collection += r.collection;
  });

  // KPIs
  var workDays   = Object.keys(byDate).length;
  var totalDays  = allDates.length;
  var totalVisits= rows.length;
  var totalOrder = rows.reduce(function(s,r){return s+r.order;},0);
  var totalColl  = rows.reduce(function(s,r){return s+r.collection;},0);
  var avgVisits  = workDays > 0 ? (totalVisits / workDays).toFixed(1) : 0;
  var attPct     = totalDays > 0 ? Math.round(workDays / totalDays * 100) : 0;

  document.getElementById("detailName").textContent = name;
  document.getElementById("detailPeriod").textContent = selectedFrom + "  to  " + selectedTo;
  document.getElementById("detailSub").textContent = workDays + " working days of " + totalDays;

  document.getElementById("detailKpis").innerHTML =
    '<div class="dk"><div class="dk-num orange">' + workDays + '</div><div class="dk-lbl">Working Days</div></div>' +
    '<div class="dk"><div class="dk-num">' + attPct + '%</div><div class="dk-lbl">Attendance</div></div>' +
    '<div class="dk"><div class="dk-num">' + totalVisits + '</div><div class="dk-lbl">Total Visits</div></div>' +
    '<div class="dk"><div class="dk-num">' + avgVisits + '</div><div class="dk-lbl">Avg Visits/Day</div></div>' +
    '<div class="dk"><div class="dk-num">₹' + fmtN(totalOrder) + '</div><div class="dk-lbl">Total Orders</div></div>' +
    '<div class="dk"><div class="dk-num">₹' + fmtN(totalColl) + '</div><div class="dk-lbl">Collection</div></div>';

  // Table rows — newest first (today at the top, working backward)
  var bodyHTML = allDates.slice().reverse().map(function(dt){
    var dow     = new Date(dt + "T00:00:00").getDay();
    var dayName = DAYS[dow];
    var isSun   = dow === 0;
    var d       = byDate[dt];

    if(!d){
      var rowCls = isSun ? "row-sunday" : "row-absent";
      var status = isSun
        ? '<span class="badge b-gray">Sunday</span>'
        : '<span class="badge b-red">Absent</span>';
      return '<tr class="' + rowCls + ' row-clickable" data-date="' + dt + '">' +
        '<td><b>' + dt + '</b></td>' +
        '<td>' + dayName + '</td>' +
        '<td>' + status + '</td>' +
        '<td>—</td><td>—</td><td>—</td>' +
      '</tr>';
    }

    // Sort times
    var times = d.times.filter(function(t){ return t && t.length >= 4; }).sort();
    var firstCall = times.length ? fmt12(times[0]) : "—";
    var lastCall  = times.length > 1 ? fmt12(times[times.length - 1]) : (times.length === 1 ? fmt12(times[0]) + " (only)" : "—");

    return '<tr class="row-clickable" data-date="' + dt + '">' +
      '<td><b>' + dt + '</b></td>' +
      '<td>' + dayName + '</td>' +
      '<td><span class="badge b-green">Present</span></td>' +
      '<td style="color:var(--gr);font-weight:700;font-size:15px;">' + firstCall + '</td>' +
      '<td style="color:var(--or);font-weight:700;font-size:15px;">' + lastCall + '</td>' +
      '<td style="font-weight:800;font-size:18px;color:var(--text);">' + d.times.length + '</td>' +
    '</tr>';
  }).join("");

  document.getElementById("detailBody").innerHTML = bodyHTML;

  // Wire up click-to-open-day-modal on every row
  document.querySelectorAll("#detailBody tr.row-clickable").forEach(function(tr){
    tr.addEventListener("click", function(){
      openDayDetail(tr.getAttribute("data-date"));
    });
  });
}

function fmt12(t){
  if(!t || t.length < 4) return "—";
  var p = t.split(":"), h = parseInt(p[0]), m = p[1] || "00";
  var ampm = h >= 12 ? " pm" : " am";
  h = h % 12 || 12;
  return h + ":" + m + ampm;
}

// ── DAY DETAIL MODAL ──
function openDayDetail(dt){
  var dow     = new Date(dt + "T00:00:00").getDay();
  var dayName = DAYS[dow];

  // Only this rep's visits, on this exact date
  var dayRows = currentRepRows
    .filter(function(r){ return r.date === dt; })
    .sort(function(a,b){ return (a.time || "").localeCompare(b.time || ""); });

  document.getElementById("dmRepName").textContent = currentRep;
  document.getElementById("dmDate").textContent = dt + "  ·  " + dayName;

  var body = document.getElementById("dmBody");

  if(!dayRows.length){
    var msg = dow === 0 ? "Sunday — no visits scheduled." : "Absent — no visits recorded on this day.";
    body.innerHTML = '<div class="no-visits">' + msg + '</div>';
  } else {
    var dayOrder = dayRows.reduce(function(s,r){ return s + r.order; }, 0);
    var dayColl  = dayRows.reduce(function(s,r){ return s + r.collection; }, 0);

    var summaryHTML =
      '<div class="modal-summary">' +
        '<div class="ms"><div class="ms-num">' + dayRows.length + '</div><div class="ms-lbl">Visits</div></div>' +
        '<div class="ms"><div class="ms-num">₹' + fmtN(dayOrder) + '</div><div class="ms-lbl">Orders</div></div>' +
        '<div class="ms"><div class="ms-num">₹' + fmtN(dayColl) + '</div><div class="ms-lbl">Collection</div></div>' +
      '</div>';

    var itemsHTML = dayRows.map(function(r, i){
      return '<div class="visit-item">' +
        '<div class="visit-top">' +
          '<span class="visit-time">' + fmt12(r.time) + '</span>' +
          '<span class="visit-idx">Visit ' + (i + 1) + ' of ' + dayRows.length + '</span>' +
        '</div>' +
        '<div class="visit-party">' + (r.party || "—") + '</div>' +
        '<div class="visit-stats">' +
          '<span>Order: <b>₹' + fmtN(r.order) + '</b></span>' +
          '<span>Collection: <b>₹' + fmtN(r.collection) + '</b></span>' +
        '</div>' +
      '</div>';
    }).join("");

    body.innerHTML = summaryHTML + itemsHTML;
  }

  document.getElementById("dayModalOverlay").classList.add("show");
}

function closeDayModal(){
  document.getElementById("dayModalOverlay").classList.remove("show");
}

document.getElementById("dmCloseBtn").addEventListener("click", closeDayModal);
document.getElementById("dayModalOverlay").addEventListener("click", function(e){
  if(e.target.id === "dayModalOverlay") closeDayModal();
});
document.addEventListener("keydown", function(e){
  if(e.key === "Escape") closeDayModal();
});

// ── BACK ──
function showList(){
  currentRep = "";
  currentRepRows = [];
  document.getElementById("backBtn").style.display = "none";
  document.getElementById("detailView").style.display = "none";
  document.getElementById("listView").style.display = "";
}

// ── DATES ──
function getDatesInRange(from, to){
  if(!from || !to) return [];
  var dates = [], cur = new Date(from + "T00:00:00"), end = new Date(to + "T00:00:00");
  while(cur <= end){ dates.push(fmt(cur)); cur.setDate(cur.getDate() + 1); }
  return dates;
}

// ── EXPORT CSV ──
function exportCSV(){
  if(!currentRep) return;
  var allDates = getDatesInRange(selectedFrom, selectedTo);
  var byDate = {};
  currentRepRows.forEach(function(r){
    if(!byDate[r.date]) byDate[r.date] = { times: [] };
    if(r.time) byDate[r.date].times.push(r.time);
  });
  var hdrs = ["Date","Day","Status","First Call","Last Call","Total Visits"];
  var csv  = [hdrs].concat(allDates.slice().reverse().map(function(dt){
    var dow     = new Date(dt + "T00:00:00").getDay();
    var dayName = DAYS[dow];
    var d       = byDate[dt];
    if(!d) return [dt, dayName, dow===0?"Sunday":"Absent", "—", "—", "0"];
    var times = d.times.filter(function(t){return t;}).sort();
    return [dt, dayName, "Present",
      times.length ? times[0] : "—",
      times.length ? times[times.length-1] : "—",
      d.times.length];
  })).map(function(r){
    return r.map(function(v){ return '"' + String(v).replace(/"/g,'""') + '"'; }).join(",");
  }).join("\n");

  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv"}));
  a.download = "salary-" + currentRep.replace(/\s+/g,"-") + "-" + selectedFrom + "-to-" + selectedTo + ".csv";
  a.click();
}

function showLoader(t){ document.getElementById("loaderTxt").textContent = t||"Loading..."; document.getElementById("loader").classList.add("show"); }
function hideLoader(){ document.getElementById("loader").classList.remove("show"); }
</script>
